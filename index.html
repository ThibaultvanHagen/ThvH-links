<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thibault van Hagen</title>
  <meta name="description" content="Thibault van Hagen — mycelium-based materials, installations and macro photography">
  <meta property="og:title" content="Thibault van Hagen">
  <meta property="og:description" content="mycelium-based materials, installations and macro photography">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ce1126' d='M4 34C4 17 17 6 32 6s28 11 28 28c0 2-1.2 3.5-3 3.5H7C5.2 37.5 4 36 4 34Z'/%3E%3Cpath fill='%23f5efe0' d='M24 36h16c0 12-2 18-3.5 21-1 2-8 2-9 0C26 54 24 48 24 36Z'/%3E%3Ccircle cx='18' cy='20' r='3.4' fill='%23fff'/%3E%3Ccircle cx='32' cy='14' r='3.8' fill='%23fff'/%3E%3Ccircle cx='46' cy='21' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <script src="https://cdn.counter.dev/script.js" data-id="db5226e1-909f-4577-b615-0119cffebcdb" data-utcoffset="2"></script>
  <style>
    @font-face {
      font-family: 'EB Garamond';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/eb-garamond-roman-latin.woff2') format('woff2');
    }
    @font-face {
      font-family: 'EB Garamond';
      font-style: italic;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/eb-garamond-italic-latin.woff2') format('woff2');
    }
    :root {
      --ink: #111;
      --paper: #fff;
      --muted: #6b6b6b;
      --serif: 'EB Garamond', Garamond, Georgia, 'Times New Roman', serif;
      --size: 16px;
    }
    * { box-sizing: border-box; }
    html {
      background: var(--paper);
      font-variant-numeric: oldstyle-nums proportional-nums;
      font-feature-settings: 'onum' 1, 'pnum' 1;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: var(--size);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizelegibility;
      margin: 0;
    }
    main {
      width: 90%;
      max-width: 400px;
      margin: 0 auto;
      padding: 3rem 0;
    }
    h1 {
      font-weight: 600;
      font-size: var(--size);
      line-height: 1.5;
      margin: 0 0 calc(var(--size) * 1.6);
      white-space: nowrap;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: calc(var(--size) * 0.45);
    }
    nav a {
      color: inherit;
      width: fit-content;
      text-decoration: none;
      text-underline-offset: 0.14em;
    }
    nav a:hover {
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
    }
    nav a:focus-visible {
      outline: 1.5px solid var(--ink);
      outline-offset: 2px;
    }
    nav a .site {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.82rem;
    }
    nav a .handle {
      color: var(--muted);
      font-style: italic;
      margin-left: 0.5ch;
    }
    section.photos {
      margin-top: calc(var(--size) * 2.8);
    }
    section.photos h2 {
      font-size: 0.82rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 calc(var(--size) * 0.8);
    }
    section.photos h2 a {
      color: inherit;
      text-decoration: none;
      text-underline-offset: 0.14em;
    }
    section.photos h2 a:hover { text-decoration: underline; }
    .strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .strip a {
      display: block;
      aspect-ratio: 1;
      overflow: hidden;
      background: #f0eeea;
    }
    .strip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .strip a:hover img { transform: scale(1.04); }
    @media (max-width: 640px) {
      main {
        padding: 2.5rem 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Thibault van Hagen</h1>
    <nav aria-label="Links">
      <a href="https://mastodon.social/@ThvH" rel="me"><span class="site">Mastodon</span> <span class="handle">@ThvH</span></a>
      <a href="https://www.instagram.com/titi.avi/"><span class="site">Instagram</span> <span class="handle">titi.avi</span></a>
      <a href="https://www.inaturalist.org/observations?place_id=any&amp;user_id=titiavi&amp;verifiable=any"><span class="site">iNaturalist</span> <span class="handle">titiavi</span></a>
      <a href="mailto:Thibault.van.Hagen@outlook.com"><span class="site">Email</span> <span class="handle">Thibault.van.Hagen@outlook.com</span></a>
    </nav>
    <section class="photos" id="photos" hidden>
      <h2><a href="https://mastodon.social/@ThvH" rel="me">Latest from Mastodon</a></h2>
      <div class="strip" id="strip"></div>
    </section>
  </main>
  <script>
    (function () {
      var API = 'https://mastodon.social/api/v1';
      fetch(API + '/accounts/lookup?acct=ThvH')
        .then(function (r) { return r.json(); })
        .then(function (me) {
          return fetch(API + '/accounts/' + me.id + '/statuses?limit=20&only_media=true');
        })
        .then(function (r) { return r.json(); })
        .then(function (posts) {
          var items = [];
          posts.forEach(function (p) {
            p.media_attachments.forEach(function (m) {
              if (m.type === 'image' && items.length < 6) {
                items.push({ src: m.preview_url, href: p.url, alt: m.description || '' });
              }
            });
          });
          if (!items.length) return;
          var strip = document.getElementById('strip');
          items.forEach(function (u) {
            var a = document.createElement('a');
            a.href = u.href;
            a.title = u.alt;
            var img = document.createElement('img');
            img.src = u.src;
            img.alt = u.alt;
            img.loading = 'lazy';
            a.appendChild(img);
            strip.appendChild(a);
          });
          document.getElementById('photos').hidden = false;
        })
        .catch(function () { /* stay hidden */ });
    })();
  </script>
</body>
</html>
